name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcadmin
          POSTGRES_PASSWORD: mcadmin_password
          POSTGRES_DB: minecraft_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcadmin -d minecraft_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Prisma schema validation requires a URL even when using the memory adapter at runtime.
      DATABASE_URL: postgresql://mcadmin:mcadmin_password@localhost:5432/minecraft_admin
      JWT_SECRET: dev_jwt_secret_change_in_production
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_DEV_AUTO_LOGIN: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # version comes from package.json "packageManager" (pnpm@9.0.0)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/agent/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @mc-admin/db db:validate

      - name: Generate Prisma client
        run: pnpm --filter @mc-admin/db db:generate

      - name: Apply Prisma migrations
        run: pnpm --filter @mc-admin/db db:migrate

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Prisma persistence smoke
        env:
          DB_ADAPTER: prisma
          NODE_ENV: test
        run: pnpm --filter @mc-admin/db exec vitest run src/persist.integration.test.ts
