version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mc_admin_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mcadmin
      POSTGRES_PASSWORD: mcadmin_password
      POSTGRES_DB: minecraft_admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mc_admin_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
