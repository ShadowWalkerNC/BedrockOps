version: '3.8'

# Local / self-host data plane + optional control-plane containers.
#
# Postgres only (scripts/start-local.sh):
#   docker compose up -d postgres
#
# Full control plane in Docker (agent still runs on the game host):
#   cp .env.example .env   # set strong secrets
#   docker compose --profile apps up -d --build
#
# See DEPLOY.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mc_admin_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mcadmin
      POSTGRES_PASSWORD: mcadmin_password
      POSTGRES_DB: minecraft_admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcadmin -d minecraft_admin']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['apps']
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: mc_admin_api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '4000'
      DB_ADAPTER: prisma
      DATABASE_URL: postgresql://mcadmin:mcadmin_password@postgres:5432/minecraft_admin
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    restart: unless-stopped

  web:
    profiles: ['apps']
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        API_URL: ${API_URL:-http://localhost:4000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: mc_admin_web
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: '3000'
      API_URL: ${API_URL:-http://api:4000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_DEV_AUTO_LOGIN: 'false'
    restart: unless-stopped

  worker:
    profiles: ['apps']
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: mc_admin_worker
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_ADAPTER: prisma
      DATABASE_URL: postgresql://mcadmin:mcadmin_password@postgres:5432/minecraft_admin
    restart: unless-stopped

volumes:
  postgres_data:
