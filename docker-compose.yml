version: '3.8'

# Local / self-host data plane. App processes (api/web/worker/agent) run via
# pnpm scripts — see DEPLOY.md and ./scripts/start-prod.sh.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mc_admin_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mcadmin
      POSTGRES_PASSWORD: mcadmin_password
      POSTGRES_DB: minecraft_admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcadmin -d minecraft_admin']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
