<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BedrockOps Companion Settings</title>
  <style>
    body {
      max-width: 480px;
      margin: 24px auto;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121824;
      color: #f8fafc;
      border-radius: 8px;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }
    input {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #10b981;
    }
    .hint {
      font-size: 11px;
      color: #64748b;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-save {
      background: #10b981;
      color: #000;
    }
    .btn-save:hover {
      background: #059669;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #34d399;
    }
  </style>
</head>
<body>
  <h2>⚡ BedrockOps Settings</h2>

  <div class="form-group">
    <label for="api-url">API Endpoint URL:</label>
    <input type="text" id="api-url" placeholder="http://localhost:4000/api/v1" />
    <span class="hint">Default: http://localhost:4000/api/v1</span>
  </div>

  <div class="form-group">
    <label for="auth-token">Bearer JWT Token:</label>
    <input type="password" id="auth-token" placeholder="Optional or JWT Token" />
    <span class="hint">Found in local storage or after logging into http://localhost:3000</span>
  </div>

  <div class="actions">
    <button id="save-btn" class="btn-save">Save Settings</button>
  </div>

  <div id="status-msg" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
